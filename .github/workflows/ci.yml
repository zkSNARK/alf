name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # x86-64 Linux (sse2/ssse3/avx2, and avx512 where the runner has it), AArch64 Linux
        # (neon, and sve/sve2 on the Arm runners' Neoverse cores), AArch64 macOS (neon).
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Let AddressSanitizer map its shadow memory (Linux)
        # Recent Ubuntu kernels randomize addresses with 32 bits of entropy, which collides
        # with AddressSanitizer's memory layout and makes sanitized tests crawl or hang.
        if: runner.os == 'Linux'
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Configure (with AddressSanitizer and UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel
      - name: SIMD backends on this runner
        run: build/alf --simd-info
      - name: Test (every SIMD backend this runner can run; the rest are skipped)
        run: ctest --test-dir build --output-on-failure --timeout 900

  # RISC-V Vector and POWER VSX: cross-compiled, tests run under QEMU (the toolchain files set
  # CMAKE_CROSSCOMPILING_EMULATOR, so plain ctest goes through it).  Release build: emulation
  # is slow enough without the sanitizers.
  cross:
    strategy:
      fail-fast: false
      matrix:
        target: [riscv64-linux-gnu, powerpc64le-linux-gnu]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Cross compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14-${{ matrix.target }} qemu-user
          sudo ln -sf /usr/bin/${{ matrix.target }}-g++-14 /usr/bin/${{ matrix.target }}-g++
          sudo ln -sf /usr/bin/${{ matrix.target }}-gcc-14 /usr/bin/${{ matrix.target }}-gcc
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/${{ matrix.target }}.cmake
      - name: Build
        run: cmake --build build --parallel
      - name: Test under QEMU (SIMD backends are listed in the TestSimd output)
        run: ctest --test-dir build --output-on-failure --timeout 1800 && ctest --test-dir build -R TestSimd -V | grep "backend runs here"

  # WebAssembly SIMD128 via Emscripten, tests run under Node.js (emcmake sets the emulator).
  wasm:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: emcmake cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: SIMD backends
        run: node build/alf.js --simd-info
      - name: Test under Node.js
        run: ctest --test-dir build --output-on-failure --timeout 1800

